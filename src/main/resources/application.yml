spring:
  application:
    name: sentinelvault

  # ── DataSource ──────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:h2:mem:sentinelvault;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  # ── JPA ────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: create-drop          # Auto-create schema for H2 development
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  # ── Flyway ─────────────────────────────────────────────────────────
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ── Redis ──────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# ── JWT ──────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:default-secret-change-me-in-production-must-be-256-bits==}           # 256-bit base64 secret — never hardcode
  expiration-ms: 3600000          # 1 hour

# ── Encryption ───────────────────────────────────────────────────────
vault:
  encryption:
    key: ${VAULT_ENCRYPTION_KEY:default-aes-key-change-me-32b==}  # AES-256 key — never hardcode

# ── Logging ──────────────────────────────────────────────────────
logging:
  level:
    com.tola.sentinelvault: INFO
    com.tola.sentinelvault.identity: INFO
    com.tola.sentinelvault.identity.infrastructure.security: INFO
    org.springframework.security: INFO
    org.springframework.security.web.access: DEBUG
