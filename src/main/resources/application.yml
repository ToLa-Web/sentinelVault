spring:
  application:
    name: sentinelvault
  # DataSource (PostgreSQL)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinelvault}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  # JPA
  jpa:
    hibernate:
      ddl-auto: update            # Use update for dev; prefer Flyway in prod
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  # Flyway
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# JWT
jwt:
  secret: ${JWT_SECRET:5eXspuluVQ+V2VznQ3xM/3cw7KFy2jk8tl0mPZTzF/g=}           # 256-bit base64 secret — never hardcode
  expiration-ms: 3600000   # 1 hour
  refresh-expiration-ms: 604800000  # Refresh token: 7 days
  refresh-cookie:
    name: refresh_token
    path: /api/auth
    domain: ${JWT_REFRESH_COOKIE_DOMAIN:}
    secure: ${JWT_REFRESH_COOKIE_SECURE:false}
    http-only: true
    same-site: Lax
    max-age-seconds: 604800

# Encryption
vault:
  encryption:
    key: ${VAULT_ENCRYPTION_KEY:5eXspuluVQ+V2VznQ3xM/3cw7KFy2jk8tl0mPZTzF/g=}  # AES-256 key — never hardcode

# Logging
logging:
  level:
    com.tola.sentinelvault: INFO
    com.tola.sentinelvault.identity: INFO
    com.tola.sentinelvault.identity.infrastructure.security: INFO
    org.springframework.security: INFO
    org.springframework.security.web.access: DEBUG
