spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sentinelvault_dev
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  # ── Disable Redis autoconfiguration locally (no Redis installed) ───
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

jwt:
  secret: dev-secret-change-me-in-production-must-be-256-bits==
  expiration-ms: 86400000         # 24h in dev

vault:
  encryption:
    key: ZGV2LWFlcy1rZXktY2hhbmdlLW1lLTMyYj09

logging:
  level:
    com.sentinelvault: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE